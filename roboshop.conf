server_tokens off;

add_header X-Request-Id $request_id always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-Id $request_id;

proxy_hide_header X-Request-Id;

proxy_connect_timeout 5s;
proxy_read_timeout 30s;

location /api/catalogue/ {
    proxy_pass http://catalogue.sodhichebutha.online:8080/;
}

location /api/user/ {
    proxy_pass http://user.sodhichebutha.online:8080/;
}

location /api/cart/ {
    proxy_pass http://cart.sodhichebutha.online:8080/;
}

location /api/shipping/ {
    proxy_pass http://shipping.sodhichebutha.online:8080/;
}

location /api/payment/ {
    proxy_pass http://payment.sodhichebutha.online:8080/;
}

error_page 502 = @bad_gateway;
error_page 504 = @gateway_timeout;

location @bad_gateway {
    default_type application/json;
    return 502 '{"message":"service not reachable"}';
}

location @gateway_timeout {
    default_type application/json;
    return 504 '{"message":"service timeout"}';
}

location = /health {
    stub_status on;
    access_log off;
}

location /images/ {
    expires 1h;
    try_files $uri /images/placeholder.jpg;
}

location /assets/ {
    expires max;
    try_files $uri =404;
}

location / {
    expires -1;
    try_files $uri $uri/ /index.html;
}